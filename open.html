<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Membuka Pilkasis...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #0f172a;
            color: #e2e8f0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .panel {
            width: 100%;
            max-width: 22rem;
            text-align: center;
        }
        .spinner {
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto 1.25rem;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; }
        .actions { display: none; margin-top: 1.25rem; gap: 0.75rem; flex-direction: column; }
        .actions.show { display: flex; }
        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(90deg, #0284c7, #0ea5e9); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.12); }
    </style>
</head>

<body>
    <div class="panel">
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <h1 id="title">Membuka Pilkasis...</h1>
        <p id="subtitle">Mengarahkan ke browser yang sesuai perangkat Anda.</p>
        <div class="actions" id="actions">
            <a class="btn btn-primary" id="btnOpenBrowser" href="#">Buka di Browser</a>
            <a class="btn btn-secondary" id="btnContinue" href="#">Lanjut di browser ini</a>
        </div>
    </div>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var qs = params.toString();
            var appUrl = new URL('./', window.location.href).href + (qs ? '?' + qs : '');

            var ua = navigator.userAgent || '';
            var isAndroid = /Android/i.test(ua);
            var isIOS = /iPhone|iPad|iPod/i.test(ua);

            function isChromeOnAndroid() {
                return isAndroid
                    && /Chrome\/\d+/i.test(ua)
                    && !/; wv\)/i.test(ua)
                    && !/SamsungBrowser|UCBrowser|OPR\/|EdgA\//i.test(ua);
            }

            function isSafariOnIOS() {
                return isIOS
                    && /Safari/i.test(ua)
                    && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
            }

            function isInAppBrowser() {
                return /FBAN|FBAV|Instagram|Line\/|MicroMessenger|Twitter|LinkedInApp|Snapchat/i.test(ua);
            }

            function buildAndroidChromeIntent(httpsUrl) {
                var u = new URL(httpsUrl);
                var intentPath = u.host + u.pathname + u.search;
                var fallback = encodeURIComponent(httpsUrl);
                return 'intent://' + intentPath
                    + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='
                    + fallback + ';end';
            }

            function buildSafariOpenUrl(httpsUrl) {
                return httpsUrl.replace(/^https:/i, 'x-safari-https:');
            }

            function goToApp() {
                window.location.replace(appUrl);
            }

            function showManualFallback(browserLabel, openHref) {
                var spinner = document.getElementById('spinner');
                var title = document.getElementById('title');
                var subtitle = document.getElementById('subtitle');
                var actions = document.getElementById('actions');
                var btnOpen = document.getElementById('btnOpenBrowser');
                var btnContinue = document.getElementById('btnContinue');

                if (spinner) spinner.style.display = 'none';
                if (title) title.textContent = 'Buka di ' + browserLabel;
                if (subtitle) subtitle.textContent = 'Jika tidak otomatis terbuka, ketuk tombol di bawah.';
                if (btnOpen) {
                    btnOpen.textContent = 'Buka di ' + browserLabel;
                    btnOpen.href = openHref;
                }
                if (btnContinue) btnContinue.href = appUrl;
                if (actions) actions.classList.add('show');
            }

            if ((isAndroid && isChromeOnAndroid()) || (isIOS && isSafariOnIOS())) {
                goToApp();
                return;
            }

            if (!isAndroid && !isIOS) {
                goToApp();
                return;
            }

            var openHref = appUrl;
            var browserLabel = 'Browser';

            if (isAndroid) {
                browserLabel = 'Chrome';
                openHref = buildAndroidChromeIntent(appUrl);
                window.location.replace(openHref);
            } else if (isIOS) {
                browserLabel = 'Safari';
                if (!isSafariOnIOS() || isInAppBrowser()) {
                    openHref = buildSafariOpenUrl(appUrl);
                    window.location.replace(openHref);
                } else {
                    goToApp();
                    return;
                }
            }

            setTimeout(function () {
                showManualFallback(browserLabel, openHref);
            }, 2200);
        })();
    </script>
</body>

</html>
